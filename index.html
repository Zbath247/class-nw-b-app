<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class_NW_B — University Networking Class Management</title>
  <meta name="description" content="Class_NW_B: manage students, teachers, courses, schedule, attendance, assignments, exams and grades for the university Networking class." />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">NW</div>
      <div>
        <h1>Class_NW_B</h1>
        <p>University Networking Class Management</p>
      </div>
    </div>
    <form id="loginForm" novalidate>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@university.edu" autocomplete="username" />
      <label for="loginPassword">Password</label>
      <div class="pw-field">
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <label class="checkline"><input type="checkbox" id="rememberMe" checked /> Remember me</label>
      <div id="loginError" class="form-error" hidden></div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <div class="login-hint">
      <strong>Demo accounts</strong> (used when no Apps Script URL is set):<br />
      admin@nw.edu / admin123 · teacher@nw.edu / teacher123 · student@nw.edu / student123
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <div class="logo">NW</div>
      <div class="sidebar-title">
        <strong>Class_NW_B</strong>
        <span>Networking Dept.</span>
      </div>
    </div>
    <nav id="navMenu" class="nav"></nav>
    <button id="logoutBtn" class="btn btn-ghost btn-block nav-logout">Logout</button>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Toggle menu">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="topbar-right">
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <div class="user-chip">
          <span id="userAvatar" class="avatar">U</span>
          <span class="user-meta">
            <strong id="userName">User</strong>
            <small id="userRole">Role</small>
          </span>
        </div>
      </div>
    </header>
    <main id="views" class="views"></main>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button id="modalClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<div id="loader" class="loader" hidden><div class="spinner"></div></div>
<div id="toasts" class="toasts"></div>

<script src="script.js"></script>
</body>
</html>
