<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASS G1-NW-B | Next-Gen Enterprise Portal</title>
    <!-- Google Fonts & FontAwesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-section">
                <div class="logo-icon"><i class="fa-solid fa-network-wired"></i></div>
                <div>
                    <h1>CLASS G1-NW-B</h1>
                    <p>NETWORK ENGINEERING PORTAL</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleDarkMode()" title="ប្តូរទម្រង់ពណ៌"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
                <a href="#admin" class="admin-login-btn"><i class="fa-solid fa-shield-halved"><span>Admin</span></i></a>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button id="btnSchedule" class="tab-btn active" onclick="switchTab('schedule')">
                <i class="fa-solid fa-calendar-days"></i> កាលវិភាគ (Schedule)
            </button>
            <button id="btnStudents" class="tab-btn" onclick="switchTab('students')">
                <i class="fa-solid fa-user-group"></i> បញ្ជីឈ្មោះ (Students)
            </button>
        </nav>

        <!-- Dynamic Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">មុខវិជ្ជាសរុប</span>
                    <h2 id="statColumns">5</h2>
                </div>
                <div class="stat-icon-box"><i class="fa-solid fa-book-bookmark"></i></div>
            </div>
            <div class="stat-card highlight-card">
                <div class="stat-info">
                    <span class="stat-label">ស្ថានភាពប្រព័ន្ធ</span>
                    <h2 class="active-status">Active</h2>
                </div>
                <div class="stat-icon-box pulse"><i class="fa-solid fa-bolt-lightning"></i></div>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="main-content">
            <div class="section-header">
                <h2>តារាងកាលវិភាគសិក្សាថ្នាក់រៀន</h2>
                <p>ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យស្វ័យប្រវត្តិតភ្ជាប់ជាមួយ Google Sheets API</p>
            </div>

            <!-- Controls Bar -->
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ស្វែងរកទិន្នន័យក្នុងប្រព័ន្ធ...">
                </div>
                <div class="action-buttons">
                    <button class="btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> បន្ថែម</button>
                    <button class="btn-secondary" onclick="refreshData()" title="ទាញយកទិន្នន័យថ្មី"><i class="fa-solid fa-rotate"></i></button>
                    <button class="btn-secondary" onclick="exportToCSV()" title="ទាញយក CSV"><i class="fa-solid fa-file-arrow-down"></i></button>
                </div>
            </div>

            <!-- Modern Table View -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="tableHeaders"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="pagination-bar">
                <span id="pageInfo">ទំព័រ 1 នៃ 1</span>
                <div class="pagination-btns">
                    <button id="prevBtn" onclick="changePage(-1)" disabled><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="nextBtn" onclick="changePage(1)" disabled><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
