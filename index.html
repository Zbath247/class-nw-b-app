<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន G1-NW-B</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- 1. ផ្ទាំង LOGIN FORM -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-blue-600">សាកលវិទ្យាល័យឌីជីថលកម្ពុជា</h2>
        <p class="text-gray-500 text-sm mt-1">ប្រព័ន្ធថ្នាក់រៀន G1-NW-B</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">អ៊ីម៉ែល</label>
          <input type="email" id="loginEmail" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="moksambath@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">ពាក្យសម្ងាត់</label>
          <input type="password" id="loginPassword" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="123456">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold hover:bg-blue-700 transition">ចូលប្រព័ន្ធ</button>
      </form>
    </div>
  </div>

  <!-- 2. ផ្ទាំង MAIN DASHBOARD -->
  <div id="dashboardSection" class="hidden p-4 md:p-8 max-w-5xl mx-auto space-y-6">
    
    <!-- User Header Bar -->
    <div class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-xl font-bold text-gray-800">សួស្តី, <span id="userName" class="text-blue-600"></span></h1>
        <p class="text-xs text-gray-500 mt-0.5">តួនាទី៖ <span id="userRole" class="font-bold uppercase text-green-600 bg-green-50 px-2 py-0.5 rounded border border-green-200"></span></p>
      </div>
      <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition border border-red-200">ចាកចេញ</button>
    </div>

    <!-- ADMIN PANEL: បន្ថែមមេរៀន/ឯកសារ -->
    <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-600">
      <h2 class="text-lg font-bold mb-4 text-blue-600 flex items-center gap-2">🛠️ ផ្ទាំង Admin: បន្ថែមមេរៀន / ឯកសារសិក្សា</h2>
      <form id="addLessonForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="lessonTitle" placeholder="ចំណងជើងមេរៀន (ឧ. DA II - Chapter 1)" required class="border p-2.5 rounded-lg col-span-2 md:col-span-1 text-sm outline-none border-gray-300">
        <input type="text" id="classCode" placeholder="កូដថ្នាក់" value="G1-NW-B" required class="border p-2.5 rounded-lg col-span-2 md:col-span-1 text-sm outline-none border-gray-300">
        <input type="url" id="fileUrl" placeholder="Link File (Google Drive Share Link)" required class="border p-2.5 rounded-lg col-span-2 text-sm outline-none border-gray-300">
        <textarea id="lessonDesc" placeholder="ការពិពណ៌នាអំពីមេរៀន..." class="border p-2.5 rounded-lg col-span-2 text-sm outline-none border-gray-300" rows="2"></textarea>
        <button type="submit" id="addLessonBtn" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 col-span-2 md:w-auto transition">រក្សាទុកមេរៀន</button>
      </form>
    </div>

    <!-- ផ្នែកកាលវិភាគសិក្សា -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">📅 កាលវិភាគសិក្សា (ថ្នាក់ G1-NW-B)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-blue-600 text-white">
              <th class="p-3 rounded-tl-lg">ថ្ងៃ</th>
              <th class="p-3">ម៉ោង</th>
              <th class="p-3">មុខវិជ្ជា</th>
              <th class="p-3">បន្ទប់</th>
              <th class="p-3 rounded-tr-lg">គ្រូបង្រៀន</th>
            </tr>
          </thead>
          <tbody id="scheduleList" class="divide-y divide-gray-100">
            <tr><td colspan="5" class="p-4 text-center text-gray-400">កំពុងទាញយកកាលវិភាគ...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ផ្នែកបញ្ជីមេរៀន -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">📖 បញ្ជីមេរៀន និង ឯកសារសិក្សា</h2>
      <div id="lessonList" class="space-y-3">
        <p class="text-gray-400 text-sm">កំពុងទាញយកទិន្នន័យមេរៀន...</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
